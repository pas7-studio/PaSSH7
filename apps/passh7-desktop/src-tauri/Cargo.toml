[package]
name = "passh7-desktop"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1.8"
passh7-core = { path = "../../../crates/passh7-core" }

# Pure Rust async SSH transport; server public keys are checked against vault pins.
russh = { version = "0.64", default-features = true }

tokio = { version = "1", features = ["time", "net", "sync", "macros", "rt", "io-util", "fs"] }

base64 = "0.22"
russh-sftp = "3"

rand = "0.10"
