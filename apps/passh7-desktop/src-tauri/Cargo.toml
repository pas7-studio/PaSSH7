[package]
name = "passh7-desktop"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Production builds embed ../dist into the binary instead of loading devUrl
# (http://localhost:1420). Without this a plain `cargo build --release`
# starts the window against a dev server that does not exist -> 404 page.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = "1.8"
passh7-core = { path = "../../../crates/passh7-core" }

# Pure Rust async SSH transport; server public keys are checked against vault pins.
russh = { version = "0.64", default-features = true }

tokio = { version = "1", features = ["time", "net", "sync", "macros", "rt", "io-util", "fs"] }

base64 = "0.22"
russh-sftp = "3"

rand = "0.10"
