name: PaSSH7 SFTP UI validation
on:
  push:
    branches:
      - feat/dedicated-ai-agent-workspace
permissions:
  contents: read
concurrency:
  group: passh7-transfer-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: [self-hosted, passh7, passh7-linux]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: TypeScript and Vite build
        working-directory: apps/passh7-desktop
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Generate Tauri test icon
        run: python3 apps/passh7-desktop/scripts/create_icon.py
      - name: Rust Docker allowlist unit tests
        run: cargo test --manifest-path apps/passh7-desktop/src-tauri/Cargo.toml --bin passh7-desktop docker_catalog_tests
