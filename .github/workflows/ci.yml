name: PaSSH7 CI (self-hosted)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: passh7-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: [self-hosted, passh7, passh7-linux]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: passh7-core
          cache-on-failure: true
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  frontend:
    runs-on: [self-hosted, passh7, passh7-linux]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/passh7-desktop
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('apps/passh7-desktop/package.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm install --no-audit --no-fund
      - run: npm run build

  # The Tauri desktop app is checked on the Linux runner. The guest image ships
  # the Tauri v2 Linux build dependencies (webkit2gtk-4.1, gtk, libsoup, etc.),
  # so no Windows runner is required.
  desktop:
    runs-on: [self-hosted, passh7, passh7-linux]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/passh7-desktop/src-tauri -> target
          shared-key: passh7-desktop
          cache-on-failure: true
      - name: Provide frontendDist placeholder
        run: mkdir -p apps/passh7-desktop/dist && printf '<!doctype html><title>PaSSH7</title>' > apps/passh7-desktop/dist/index.html
      - run: cargo check --manifest-path apps/passh7-desktop/src-tauri/Cargo.toml
