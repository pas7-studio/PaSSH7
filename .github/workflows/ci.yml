name: PaSSH7 CI (self-hosted only)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: passh7-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: passh7-linux
          - runner: passh7-windows
    runs-on: [self-hosted, passh7, '${{ matrix.runner }}']
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: passh7-core
          cache-on-failure: true
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked

  frontend:
    runs-on: [self-hosted, passh7, passh7-linux]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/passh7-desktop
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build

  desktop-windows:
    runs-on: [self-hosted, passh7, passh7-windows]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/passh7-desktop/src-tauri -> target
          shared-key: passh7-desktop
          cache-on-failure: true
      - run: cargo check --manifest-path apps/passh7-desktop/src-tauri/Cargo.toml
