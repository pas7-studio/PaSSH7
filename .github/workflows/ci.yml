name: PaSSH7 Linux self-hosted build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: passh7-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: [self-hosted, passh7, passh7-linux]
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/passh7-desktop/src-tauri -> target
          shared-key: passh7-linux
          cache-on-failure: true
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-Linux-${{ hashFiles('apps/passh7-desktop/package-lock.json', 'apps/passh7-desktop/package.json') }}
          restore-keys: npm-Linux-
      - name: Validate Rust core
        run: |
          cargo fmt --all
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo build --release -p passh7
      - name: Build frontend
        working-directory: apps/passh7-desktop
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Check preinstalled Linux Tauri prerequisites
        run: |
          pkg-config --modversion webkit2gtk-4.1
          pkg-config --modversion ayatana-appindicator3-0.1
      - name: Build Linux desktop
        working-directory: apps/passh7-desktop
        run: npm run tauri build -- --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: PaSSH7-Linux
          path: |
            target/release/passh7
            apps/passh7-desktop/src-tauri/target/release/passh7-desktop
          if-no-files-found: error
          retention-days: 14
