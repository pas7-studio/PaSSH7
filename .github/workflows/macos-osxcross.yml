name: PaSSH7 macOS osxcross experimental
on:
  push:
    branches: [feat/macos-osxcross-build]
    paths:
      - '.github/workflows/macos-osxcross.yml'
      - 'apps/passh7-desktop/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: passh7-osxcross-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos-cross:
    runs-on: [self-hosted, passh7, passh7-linux]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Probe Ubuntu osxcross prerequisites
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          command -v cargo || true
          command -v rustup || true
          command -v clang || true
          command -v docker || true
          command -v file || true
          docker info --format '{{.ServerVersion}}' 2>&1 || true
          for path in /opt/osxcross/target/bin /opt/osxcross/bin /usr/local/osxcross/target/bin /usr/local/osxcross/bin; do
            if test -d "$path"; then echo "Installed osxcross: $path"; ls "$path" | head -15; fi
          done
          for base in /opt /usr/local /home/runner /home/oai; do
            if test -d "$base"; then
              find "$base" -maxdepth 4 \( -type f -name 'MacOSX*.sdk.tar.*' -o -type d -name 'MacOSX*.sdk' \) -print 2>/dev/null | head -12 || true
            fi
          done
