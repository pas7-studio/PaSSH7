name: PaSSH7 macOS osxcross experimental
on:
  push:
    branches: [feat/macos-osxcross-build]
    paths:
      - '.github/workflows/macos-osxcross.yml'
      - 'apps/passh7-desktop/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: passh7-osxcross-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos-arm64-cross:
    runs-on: [self-hosted, passh7, passh7-linux]
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: '0'
      PASSH7_MACOS_TARGET: aarch64-apple-darwin
      PASSH7_MACOS_SDK_URL: https://github.com/joseluisq/macosx-sdks/releases/download/15.5/MacOSX15.5.sdk.tar.xz
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install rootless LLVM and osxcross dependencies
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: osxcross
          init-shell: bash
          create-args: >-
            -c conda-forge
            clang
            clangxx
            llvm
            lld
            cmake
            make
            libxml2
            openssl
            zlib
            xz
            bzip2
      - name: Check rootless build tools
        shell: micromamba-shell {0}
        run: |
          clang --version
          ld.lld --version
          cmake --version
          command -v clang
          command -v llvm-ar
          command -v git
          command -v cpio || true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify SDK archive fingerprint
        shell: bash
        run: |
          set -euo pipefail
          checksum="$(curl -fsSL https://github.com/joseluisq/macosx-sdks/releases/download/15.5/sha256sum.txt)"
          echo "$checksum" | grep -F 'MacOSX15.5.sdk.tar.xz'
          digest="$(echo "$checksum" | grep -F 'MacOSX15.5.sdk.tar.xz' | awk '{print $1}')"
          echo "$digest" | grep -Eq '^[a-fA-F0-9]{64}$'
          echo "PASSH7_MACOS_SDK_SHA256=$digest" >> "$GITHUB_ENV"
      - name: Build PaSSH7 Darwin arm64 with osxcross
        shell: micromamba-shell {0}
        run: bash apps/passh7-desktop/scripts/build-macos-osxcross.sh
      - name: Upload unsigned experimental macOS app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PaSSH7-macOS-arm64-osxcross-EXPERIMENTAL
          path: apps/passh7-desktop/macos-experimental/PaSSH7-macOS-arm64-unsigned-experimental.zip
          if-no-files-found: error
          retention-days: 14
