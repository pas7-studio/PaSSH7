name: Windows cross-build on Linux self-hosted
on:
  push:
    branches: [main]
    paths:
      - 'apps/passh7-desktop/**'
      - 'crates/passh7-core/**'
      - '.github/workflows/windows-cross.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: passh7-windows-cross-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-cross:
    runs-on: [self-hosted, passh7, passh7-linux]
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      AWS_LC_SYS_PREBUILT_NASM: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache user-local llvm-mingw toolchain
        uses: actions/cache@v4
        with:
          path: .toolchain/llvm-mingw
          key: llvm-mingw-ucrt-20261006-linux-x64
      - name: Download llvm-mingw UCRT toolchain from GitHub
        run: |
          if [ ! -x .toolchain/llvm-mingw/bin/x86_64-w64-mingw32-clang ]; then
            mkdir -p .toolchain/llvm-mingw
            curl -fL --retry 3 --output /tmp/llvm-mingw.tar.xz https://github.com/mstorsjo/llvm-mingw/releases/download/20261006/llvm-mingw-20261006-ucrt-ubuntu-22.04-x86_64.tar.xz
            tar -xJf /tmp/llvm-mingw.tar.xz -C .toolchain/llvm-mingw --strip-components=1
          fi
          test -x .toolchain/llvm-mingw/bin/x86_64-w64-mingw32-clang
      - name: Cache target Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/passh7-desktop/src-tauri/target/x86_64-pc-windows-gnu
          key: passh7-cross-gnu-${{ runner.os }}-${{ hashFiles('apps/passh7-desktop/src-tauri/Cargo.toml') }}
          restore-keys: |
            passh7-cross-gnu-${{ runner.os }}-
      - name: Map LLVM-MinGW runtimes for Rust GNU linker
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/.toolchain/llvm-mingw"
          libdir="$root/x86_64-w64-mingw32/lib"
          mkdir -p "$libdir"
          # Rust's windows-gnu target asks for -lgcc/-lgcc_eh, but LLVM-MinGW
          # intentionally supplies compiler-rt and libunwind instead.
          builtins="$(find "$root/lib/clang" -type f -name 'libclang_rt.builtins-x86_64.a' -print -quit)"
          # llvm-mingw contains ARM and x64 runtimes; select the x64 target only.
          unwind="$(find "$root/x86_64-w64-mingw32" -type f -name 'libunwind.a' -print -quit)"
          echo "Compiler RT: $builtins"
          echo "Unwind (x64): $unwind"
          if [ -z "$unwind" ]; then
            echo "x64 libunwind not found; available archives:"
            find "$root" -type f -name 'libunwind.a' -print
            exit 1
          fi
          test -n "$builtins" && test -s "$builtins"
          test -n "$unwind" && test -s "$unwind"
          ln -sfn "$builtins" "$libdir/libgcc.a"
          ln -sfn "$unwind" "$libdir/libgcc_eh.a"
          test -r "$libdir/libgcc.a"
          test -r "$libdir/libgcc_eh.a"
      - name: Prepare Windows icon and frontend
        run: |
          python3 apps/passh7-desktop/scripts/create_icon.py
          npm install --no-audit --no-fund --prefix apps/passh7-desktop
      - name: Cross-compile Windows GNU exe
        working-directory: apps/passh7-desktop
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-clang
          CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-clang
          CXX_x86_64_pc_windows_gnu: x86_64-w64-mingw32-clang++
          AR_x86_64_pc_windows_gnu: x86_64-w64-mingw32-llvm-ar
        run: |
          export PATH="$GITHUB_WORKSPACE/.toolchain/llvm-mingw/bin:$PATH"
          export PASSH7_BUILD_COMMIT="$GITHUB_SHA"
          export PASSH7_BUILD_TIMESTAMP="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          export PASSH7_BUILD_RUN="$GITHUB_RUN_NUMBER"
          npm run tauri build -- --target x86_64-pc-windows-gnu --no-bundle
      - name: Verify Windows portable executable
        run: |
          set -euo pipefail
          exe="apps/passh7-desktop/src-tauri/target/x86_64-pc-windows-gnu/release/passh7-desktop.exe"
          test -s "$exe"
          file "$exe"
          file "$exe" | grep -E 'PE32\+ executable.*x86-64'
          python3 - "$exe" <<'PY'
          import pathlib, struct, sys
          data = pathlib.Path(sys.argv[1]).read_bytes()
          assert data[:2] == b'MZ', 'Missing DOS header'
          pe = struct.unpack_from('<I', data, 0x3c)[0]
          assert data[pe:pe+4] == bytes((80, 69, 0, 0)), 'Missing PE signature'
          assert struct.unpack_from('<H', data, pe+4)[0] == 0x8664, 'Not Windows x86_64'
          print(f'Validated Windows x64 PE: {len(data):,} bytes')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PaSSH7-Windows-GNU-x64-experimental
          path: apps/passh7-desktop/src-tauri/target/x86_64-pc-windows-gnu/release/passh7-desktop.exe
          if-no-files-found: error
          retention-days: 14
